[package]
name = "liquidity-vault"
version = "0.1.0"
description = "Liquidity Vault — Solana DeFi vault with share tokens (Weeks 8–13)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "liquidity_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.2"

[dev-dependencies]
litesvm = "0.18.1"
solana-keypair = "3.0.1"
solana-message = "4"
solana-signer = "3.0.0"
solana-transaction = "4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
