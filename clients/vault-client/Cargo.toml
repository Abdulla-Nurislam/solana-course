[package]
name = "vault-client"
version = "0.1.0"
description = "Rust CLI client for Liquidity Vault (Weeks 8–13)"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "vault-client"
path = "src/main.rs"

[dependencies]
liquidity-vault = { path = "../../programs/liquidity-vault", features = ["no-entrypoint"] }
anchor-lang = "1.2.0"
anchor-spl = "1.2.2"
anyhow = "1.0"
base64 = "0.22.1"
bincode = "1.3.3"
bs58 = "0.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-keypair = "3.0.1"
solana-message = { version = "4", features = ["serde"] }
solana-signer = "3.0.0"
solana-transaction = { version = "4", features = ["serde", "wincode"] }
